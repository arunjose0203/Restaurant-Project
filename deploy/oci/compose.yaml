name: tableflow
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-restaurant.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  api:
    build:
      context: ../../server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Restaurant: "Host=db;Port=5432;Database=restaurant;Username=restaurant_app;Password=${APP_DB_PASSWORD};SSL Mode=Disable"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY}
      Jwt__Issuer: Tableflow
      Jwt__Audience: Tableflow
      Bootstrap__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      Bootstrap__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      Cors__Origins__0: https://${APP_DOMAIN:?Set APP_DOMAIN}
      AllowedHosts: ${APP_DOMAIN};api;localhost
    depends_on:
      db: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  web:
    build:
      context: ../..
      dockerfile: deploy/oci/Web.Dockerfile
      args:
        VITE_API_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
